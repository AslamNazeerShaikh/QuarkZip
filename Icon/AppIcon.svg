<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">QuarkZip</title>
  <desc id="desc">A blue-to-violet archive tray holding three jewel-toned glass file cards, with a gold sparkle on a pale glass tile.</desc>

  <defs>
    <linearGradient id="tile" x1="120" y1="100" x2="904" y2="924" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#DDF7FF"/>
      <stop offset="0.48" stop-color="#F8FBFF"/>
      <stop offset="1" stop-color="#F2D9FF"/>
    </linearGradient>
    <radialGradient id="tileLight" cx="0" cy="0" r="1" gradientTransform="translate(480 410) rotate(45) scale(620)">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.92"/>
      <stop offset="0.58" stop-color="#FFFFFF" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="backRim" x1="210" y1="462" x2="814" y2="578" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#A678FF"/>
      <stop offset="0.48" stop-color="#7B4DFF"/>
      <stop offset="1" stop-color="#4C1D95"/>
    </linearGradient>
    <linearGradient id="purple" x1="345" y1="238" x2="637" y2="548" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#AC7CFF"/>
      <stop offset="0.45" stop-color="#7C4DFF"/>
      <stop offset="1" stop-color="#5B21E8"/>
    </linearGradient>
    <linearGradient id="red" x1="292" y1="312" x2="694" y2="602" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FF7186"/>
      <stop offset="0.46" stop-color="#FF4D6D"/>
      <stop offset="1" stop-color="#FF7A3D"/>
    </linearGradient>
    <linearGradient id="yellow" x1="352" y1="390" x2="688" y2="640" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFE86A"/>
      <stop offset="0.5" stop-color="#FFD21F"/>
      <stop offset="1" stop-color="#FF9F0A"/>
    </linearGradient>
    <linearGradient id="body" x1="212" y1="520" x2="812" y2="752" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#25C8FF"/>
      <stop offset="0.3" stop-color="#168CFF"/>
      <stop offset="0.68" stop-color="#4C5CFF"/>
      <stop offset="1" stop-color="#8A2BE8"/>
    </linearGradient>
    <linearGradient id="lip" x1="212" y1="502" x2="812" y2="536" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8AF4FF"/>
      <stop offset="0.38" stop-color="#35B9FF"/>
      <stop offset="1" stop-color="#7A6BFF"/>
    </linearGradient>
    <linearGradient id="handle" x1="430" y1="620" x2="594" y2="666" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.55" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#EBF1FF"/>
    </linearGradient>
    <linearGradient id="whiteFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.72"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="leftFade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.48"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="star" cx="0" cy="0" r="1" gradientTransform="translate(710 206) rotate(55) scale(160)">
      <stop offset="0" stop-color="#FFF8B8"/>
      <stop offset="0.44" stop-color="#FFE04A"/>
      <stop offset="1" stop-color="#FFB300"/>
    </radialGradient>
    <radialGradient id="starGlow" cx="0" cy="0" r="1" gradientTransform="translate(722 224) scale(205)">
      <stop offset="0" stop-color="#FFD60A" stop-opacity="0.34"/>
      <stop offset="0.5" stop-color="#FFD60A" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#FFD60A" stop-opacity="0"/>
    </radialGradient>
    <filter id="tileShadow" x="-25%" y="-25%" width="150%" height="160%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
    <filter id="cardShadow" x="-30%" y="-30%" width="170%" height="180%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#360D73" flood-opacity="0.26"/>
    </filter>
    <filter id="boxShadow" x="-30%" y="-30%" width="170%" height="180%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#2A0A65" flood-opacity="0.30"/>
    </filter>
    <filter id="starShadow" x="-40%" y="-40%" width="180%" height="190%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#B86A00" flood-opacity="0.26"/>
    </filter>
    <clipPath id="tileClip"><rect x="100" y="100" width="824" height="824" rx="185"/></clipPath>
    <clipPath id="purpleClip"><rect x="345" y="238" width="292" height="310" rx="36"/></clipPath>
    <clipPath id="redClip"><rect x="292" y="312" width="402" height="290" rx="36"/></clipPath>
    <clipPath id="yellowClip"><rect x="352" y="390" width="336" height="250" rx="36"/></clipPath>
    <clipPath id="bodyClip"><path d="M212 520H812L786 720C782 739 767 752 748 752H276C257 752 242 739 238 720Z"/></clipPath>
    <linearGradient id="bottomShade" x1="0" y1="650" x2="0" y2="752" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3A0A8F" stop-opacity="0"/>
      <stop offset="1" stop-color="#3A0A8F" stop-opacity="0.18"/>
    </linearGradient>
  </defs>

  <rect x="112" y="120" width="800" height="800" rx="180" fill="#59647A" opacity="0.22" filter="url(#tileShadow)"/>

  <g clip-path="url(#tileClip)">
    <rect x="100" y="100" width="824" height="824" fill="url(#tile)"/>
    <rect x="100" y="100" width="824" height="824" fill="url(#tileLight)"/>

    <!-- inner back rim -->
    <rect x="222" y="492" width="580" height="64" rx="24" fill="url(#backRim)"/>

    <!-- purple card -->
    <g transform="rotate(8 491 388)" filter="url(#cardShadow)">
      <g clip-path="url(#purpleClip)">
        <rect x="345" y="238" width="292" height="310" rx="36" fill="url(#purple)"/>
        <rect x="345" y="238" width="292" height="54" fill="url(#whiteFade)"/>
        <rect x="347" y="240" width="288" height="7" rx="3.5" fill="#FFFFFF" opacity="0.64"/>
        <rect x="345" y="238" width="12" height="310" fill="url(#leftFade)"/>
      </g>
    </g>

    <!-- red card -->
    <g transform="rotate(7 493 452)" filter="url(#cardShadow)">
      <g clip-path="url(#redClip)">
        <rect x="292" y="312" width="402" height="290" rx="36" fill="url(#red)"/>
        <rect x="292" y="312" width="402" height="52" fill="url(#whiteFade)"/>
        <rect x="294" y="314" width="398" height="7" rx="3.5" fill="#FFFFFF" opacity="0.64"/>
        <rect x="292" y="312" width="12" height="290" fill="url(#leftFade)"/>
      </g>
    </g>

    <!-- yellow card -->
    <g transform="rotate(4 520 510)" filter="url(#cardShadow)">
      <g clip-path="url(#yellowClip)">
        <rect x="352" y="390" width="336" height="250" rx="36" fill="url(#yellow)"/>
        <rect x="352" y="390" width="336" height="50" fill="url(#whiteFade)"/>
        <rect x="354" y="392" width="332" height="7" rx="3.5" fill="#FFFFFF" opacity="0.64"/>
        <rect x="352" y="390" width="12" height="250" fill="url(#leftFade)"/>
      </g>
    </g>

    <!-- archive tray -->
    <g filter="url(#boxShadow)">
      <g clip-path="url(#bodyClip)">
        <path fill="url(#body)" d="M212 520H812L786 720C782 739 767 752 748 752H276C257 752 242 739 238 720Z"/>
        <rect x="212" y="650" width="600" height="102" fill="url(#bottomShade)"/>
      </g>
      <rect x="224" y="536" width="576" height="18" rx="9" fill="#161C62" opacity="0.20"/>
      <rect x="238" y="724" width="548" height="28" rx="14" fill="#4B0FA8" opacity="0.14"/>


      <rect x="212" y="502" width="600" height="34" rx="17" fill="url(#lip)"/>
      <rect x="228" y="507" width="568" height="7" rx="3.5" fill="#FFFFFF" opacity="0.78"/>
      <rect x="224" y="530" width="576" height="6" rx="3" fill="#FFFFFF" opacity="0.14"/>
      <rect x="212" y="534" width="600" height="6" rx="3" fill="#0B3CB8" opacity="0.22"/>
    </g>

    <!-- handle -->
    <rect x="430" y="620" width="164" height="46" rx="23" fill="url(#handle)"/>
    <rect x="438" y="626" width="148" height="6" rx="3" fill="#FFFFFF" opacity="0.92"/>
    <rect x="438" y="652" width="148" height="8" rx="4" fill="#AEBDE0" opacity="0.32"/>

    <!-- sparkle -->
    <circle cx="722" cy="224" r="205" fill="url(#starGlow)"/>
    <g filter="url(#starShadow)">
      <path fill="url(#star)" d="M722 132C735 184 768 210 818 224C768 238 735 264 722 316C709 264 676 238 626 224C676 210 709 184 722 132Z"/>
      <path fill="#FFFFFF" opacity="0.34" d="M722 152C731 190 755 211 792 217C755 224 731 240 722 266C713 240 689 224 652 217C689 211 713 190 722 152Z"/>
    </g>
  </g>

  <rect x="100.5" y="100.5" width="823" height="823" rx="184.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.58"/>
</svg>
