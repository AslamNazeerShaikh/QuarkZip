[package]
name = "quarkzip-egui"
version = "0.1.0"
edition = "2021"
description = "QuarkZip egui frontend — the Tauri app's archive manager UI in pure Rust, same in-process 7-Zip engine"

[[bin]]
name = "quarkzip-egui"
path = "src/main.rs"

[dependencies]
eframe = "0.36"
dark-light = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.15"
md-5 = "0.11"
sha1 = "0.11"
sha2 = "0.11"
digest = "0.11"

[build-dependencies]
cc = "1"

[profile.dev]
opt-level = 1
